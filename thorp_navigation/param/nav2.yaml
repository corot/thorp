# Nav2 configuration for Thorp; values come from the Noetic Move Base Flex and AMCL configuration where there was
# an equivalent, and from Nav2 defaults otherwise

amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /kinect/scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2  # translation std dev, m
    alpha4: 0.2
    alpha5: 0.1
    max_beams: 60
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    update_min_d: 0.25
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 1.0  # increase tolerance because the computer can get quite busy
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    tf_broadcast: true

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code]

controller_server:
  ros__parameters:
    controller_frequency: 20.0  # MPPI needs a controller period no longer than its model_dt
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker, precise_goal_checker]
    controller_plugins: [FollowPath, PreciseFollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1  # as Noetic oscillation_distance and oscillation_timeout
      movement_time_allowance: 6.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
    precise_goal_checker:  # for docking at tables, as Noetic's precise_controlling configuration
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.035
      yaw_goal_tolerance: 0.05
    # MPPI replaces Noetic's TEB; velocity and acceleration limits come from TEB and the velocity smoother
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 0.5
      ax_min: -0.5
      az_max: 1.0
      vx_std: 0.2
      wz_std: 0.4
      vx_max: 0.7
      vx_min: -0.1  # conservative, as we only have four IR sensors pointing backward
      wz_max: 2.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic,
                PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

# Costmaps: static map (global only), sonars and IR range sensors, obstacles from the depth cameras, inflation.
# The semantic layer comes with its own block
    # Docking at tables, along a straight path to the pickup pose: slow and exact, turning in place to the path's
    # heading and then to the goal's, as Noetic's precise_controlling configuration of TEB
    PreciseFollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.15
      min_lookahead_dist: 0.1
      max_lookahead_dist: 0.3
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.3
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false  # the table is close by design
      approach_velocity_scaling_dist: 0.2
      min_approach_linear_velocity: 0.05
      # steer for a point beyond the end of the path, along its last segment; steering for the goal itself, a few
      # centimeters off the robot's heading, makes it circle around the goal without ever reaching its tolerance
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 0.2
      interpolate_curvature_after_goal: true
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 10.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.02
      transform_tolerance: 0.5
      robot_radius: 0.18
      plugins: [sonars_layer, infrared_layer, obstacle_layer, semantic_layer, inflation_layer]
      sonars_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        clear_threshold: 0.46
        mark_threshold: 0.98
        no_readings_timeout: 0.0  # disabled, see the range messages known issue in the migration doc
        clear_on_max_reading: true
        topics: [/mobile_base/sensors/sonars/m90, /mobile_base/sensors/sonars/m72, /mobile_base/sensors/sonars/m54,
                 /mobile_base/sensors/sonars/m36, /mobile_base/sensors/sonars/m18, /mobile_base/sensors/sonars/p0,
                 /mobile_base/sensors/sonars/p18, /mobile_base/sensors/sonars/p36, /mobile_base/sensors/sonars/p54,
                 /mobile_base/sensors/sonars/p72, /mobile_base/sensors/sonars/p90]
      infrared_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        clear_threshold: 0.4
        mark_threshold: 0.9
        no_readings_timeout: 0.0  # disabled, see the range messages known issue in the migration doc
        clear_on_max_reading: true
        topics: [/mobile_base/sensors/infrared/arm, /mobile_base/sensors/infrared/l155,
                 /mobile_base/sensors/infrared/l180, /mobile_base/sensors/infrared/r180,
                 /mobile_base/sensors/infrared/r155]
      obstacle_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        max_obstacle_height: 1.0  # robot ~0.9
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 5
        publish_voxel_map: true
        observation_sources: xtion kinect
        xtion:
          topic: /xtion/scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.8
          max_obstacle_height: 1.0
          obstacle_max_range: 2.0  # half local map side
          raytrace_max_range: 2.5
        kinect:
          topic: /kinect/scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.2
          max_obstacle_height: 0.4
          obstacle_max_range: 2.0
          raytrace_max_range: 2.5
      semantic_layer:
        # Known objects the executive marks, as tables, that the scans can't see well, or areas it clears, as a
        # table's approach; painted in increasing precedence
        plugin: thorp_costmap_layers::SemanticLayer
        object_types: [obstacle, free_space, blocked_area]
        obstacle:  # the perimeter, lethal
          cost: 1.0
          fill: false
          precedence: 0
        free_space:  # cleared after all obstacles are added
          cost: 0.0
          fill: true
          precedence: 100
        blocked_area:  # filled, lethal
          cost: 1.0
          fill: true
          precedence: 0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      track_unknown_space: true
      robot_radius: 0.18
      resolution: 0.05
      plugins: [static_layer, sonars_layer, infrared_layer, obstacle_layer, semantic_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      sonars_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        clear_threshold: 0.46
        mark_threshold: 0.98
        no_readings_timeout: 0.0  # disabled, see the range messages known issue in the migration doc
        clear_on_max_reading: true
        topics: [/mobile_base/sensors/sonars/m90, /mobile_base/sensors/sonars/m72, /mobile_base/sensors/sonars/m54,
                 /mobile_base/sensors/sonars/m36, /mobile_base/sensors/sonars/m18, /mobile_base/sensors/sonars/p0,
                 /mobile_base/sensors/sonars/p18, /mobile_base/sensors/sonars/p36, /mobile_base/sensors/sonars/p54,
                 /mobile_base/sensors/sonars/p72, /mobile_base/sensors/sonars/p90]
      infrared_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        clear_threshold: 0.4
        mark_threshold: 0.9
        no_readings_timeout: 0.0  # disabled, see the range messages known issue in the migration doc
        clear_on_max_reading: true
        topics: [/mobile_base/sensors/infrared/arm, /mobile_base/sensors/infrared/l155,
                 /mobile_base/sensors/infrared/l180, /mobile_base/sensors/infrared/r180,
                 /mobile_base/sensors/infrared/r155]
      obstacle_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        max_obstacle_height: 1.0  # robot ~0.9
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 5
        publish_voxel_map: true
        observation_sources: xtion kinect
        xtion:
          topic: /xtion/scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.8
          max_obstacle_height: 1.0
          obstacle_max_range: 2.0  # half local map side
          raytrace_max_range: 2.5
        kinect:
          topic: /kinect/scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.2
          max_obstacle_height: 0.4
          obstacle_max_range: 2.0
          raytrace_max_range: 2.5
      semantic_layer:
        # Known objects the executive marks, as tables, that the scans can't see well, or areas it clears, as a
        # table's approach; painted in increasing precedence
        plugin: thorp_costmap_layers::SemanticLayer
        object_types: [obstacle, free_space, blocked_area]
        obstacle:  # the perimeter, lethal
          cost: 1.0
          fill: false
          precedence: 0
        free_space:  # cleared after all obstacles are added
          cost: 0.0
          fill: true
          precedence: 100
        blocked_area:  # filled, lethal
          cost: 1.0
          fill: true
          precedence: 0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    frame_id: map

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0  # Noetic replanned every second
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    # NavFn replaces Noetic's GlobalPlanner and NavfnPlanner
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.0
      use_astar: false
      allow_unknown: false

# Smooths paths, e.g. those computed through waypoints with compute_path_through_poses
smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# Follows a pose topic or a TF frame at a distance, replacing Noetic's pose follower
following_server:
  ros__parameters:
    base_frame: base_footprint
    fixed_frame: odom
    odom_topic: /odom
    desired_distance: 0.8  # the cat hunter's firing distance, within the cannon's reach
    detection_timeout: 2.0
    controller_frequency: 20.0
    controller:
      v_linear_max: 0.7  # Noetic's follow smoother limits
      v_angular_max: 2.0
      use_collision_detection: false

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Noetic clearing rotation values
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# Noetic velocity smoother values; decelerating 50% faster than accelerating
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.7, 0.0, 3.3]
    min_velocity: [-0.7, 0.0, -3.3]
    max_accel: [0.2, 0.0, 1.0]
    max_decel: [-0.3, 0.0, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
