# What each behavior tree under bt/ offers when invoked through the RunSubtree action.
#
# Two consumers read this file, which is the point of it existing:
#   - test/test_capabilities.py parametrizes over these entries
#   - the agent side (ROSA) turns them into tool descriptions
# so drift here isn't harmless bookkeeping: if an entry stops matching its tree, the tests
# fail and the agent's picture of the robot is wrong in the same stroke.
#
# `inputs` and `outputs` were derived from the trees, not written from memory: inputs are the
# blackboard keys a tree reads but never produces, outputs the keys it writes.
# test/test_capabilities_match_trees.py recomputes both from bt/*.xml and fails when this file
# disagrees. The `description` fields are the part that ISN'T derived -- they're my reading
# of each tree's structure and want a human pass, since they're what the agent reasons over.
#
# An output's `when` says whether it will be there once the tree is done -- "the tree can write
# this key" and "the tree did write this key" are different claims, and an agent that can't
# tell them apart reads a missing error code as a broken capability. It follows the callback
# the setOutput sits in:
#   success  - written on the path that succeeds (a tick, or an action's onSucceeded), so a run
#              reporting success has it. The default, so it's left off rather than repeated on
#              nearly every entry.
#   failure  - written only when something went wrong: a setOutput inside onAborted. A run that
#              succeeded has nothing to report here, and its absence is the good outcome. Error
#              codes are almost all of these.
#   maybe    - written from a callback that may never fire -- onRunning or onFeedback on an
#              action that returned first time, or a branch not taken. Worth asking for, never
#              worth relying on.
# The test suite asks for every documented output and insists only on the `success` ones, so a
# clean run isn't failed for the absence of an error it never had.
#
# An input marked `optional: true` may be left out: the tree reads it when given and otherwise
# produces it itself, typically from a parameter. The drift test holds it to exactly that.
#
# `errors` names the codes (thorp_msgs/ThorpError) a capability fails with when its checks, as
# thorp_world's, say it can't do what it was asked, and what each means: pickup_object of an
# object on a table the robot isn't at fails with NOT_AT_TABLE, and approaching that table is
# what it takes. What holds now -- where each object is, which table the robot is at, what is
# within reach -- is the world's to tell, so capabilities declare no preconditions of their own.
#
# An `error` output is a thorp_msgs/ThorpError: a code to act on, one of `errors` or else the
# failing server's own (MoveIt's, Nav2's or Thorp's), and a text saying in a line what failed,
# as how far out of reach a target is, or which objects collide. Nav2's own tree nodes report
# their bare codes, as nav_error.
#
# kind:
#   capability - a step an agent can ask for. The default, so it is left off.
#   app        - a whole session's behavior rather than a step: it drives the robot until
#                something stops it, or it waits for a person at the keyboard. These stay
#                described here because the drift test insists every tree is accounted for
#                and because their interfaces are still worth checking, but the agent side
#                must not offer them, and the test suite skips them unless --apps is passed.
#                A tree that cannot finish on its own (KeepRunningUntilFailure at the root,
#                or Repeat with no cycle limit) HAS to be one; the drift test checks that.
#
# status:
#   ok       - callable through RunSubtree today
#   blocked  - the tree needs an input bt_server can't put on a blackboard yet; see `blocked`.
#              Left in deliberately rather than omitted: the test suite reports these as skips
#              with their reason, so the gap stays visible.
#
# stack: what must already be running for the tree to do anything
#   none | navigation | manipulation | perception | exploration (the exploration planner) |
#   target_detection (YOLO and the target tracker)
#
# test: read only by the test suite; the agent side ignores this block. Every test starts from
# the scene as the session found it, and with --world, from the world thorp_world knows loaded
# from that file, so the ids the tests name are those of the objects on the table.
#   inputs_from: where an input comes from, when it should be a real value rather than one
#     someone typed in: {pose: [go_to_table, inspect_pose]} takes the pose go_to_table drove
#     to, and a third element indexes a list, so [cover_in_one_tour,
#     coverage_waypoints, 0] is the first waypoint of a coverage path. Usable on the test's own
#     inputs and on any setup step's. This is the same threading an agent does by hand between
#     two goals, so a chain expressible here is one ROSA can be asked to follow.
#   setup: capabilities to call first, in order, to put the robot in the state this one
#     assumes. pickup_object needs something detected to pick; place_object needs the gripper
#     holding it. Written as capability calls rather than staged behind the robot's back, so
#     the precondition is stated in the same vocabulary the agent would reach it with, and a
#     step that fails SKIPS the test instead of failing it -- "this capability is broken" and
#     "the world wasn't ready for it" are different findings and shouldn't look alike. The
#     stacks a setup step needs count toward the ones this capability needs. A step with
#     `unless: {at_table: <table id>}` is left out when the session starts with the robot at that
#     table, as on the playground's tabletop launch, and so are the stacks it needs.
#   expect: succeeded | failed | any | runs
#     `any` means the physical outcome depends on the scene and isn't asserted -- the contract
#     (goal served, requested outputs returned, types right) is still checked either way.
#     `runs` is for the app-level trees that never finish by design (KeepRunningUntilFailure,
#     or a Repeat with no cycle count): the test lets one run for `cancel_after` seconds, then
#     cancels and checks it was still going and had produced something. Without this they'd
#     just hit their timeout and be reported as failures.

capabilities:

  # ------------------------------------------------------------------- manipulation --------

  pickup_object:
    description: >
      Pick up an object thorp_world knows, by its id, with the arm, retrying with a cleared octomap
      if the first attempt fails. The object must be on the table the robot is at and within the
      arm's reach, and the gripper empty; the world records it in the gripper, or as disturbed if
      the pickup failed.
    status: ok
    stack: [manipulation]
    inputs:
      object_name: {type: string, description: "id of the object to pick, as thorp_world knows it: 'cube 1'"}
      tightening: {type: float, optional: true, description: "extra gripper closure past contact, in meters; leave it out to use the gripper's configured value"}
    outputs:
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why it failed: one of errors, the pickup action's, or OBJECT_NOT_ATTACHED if the grasp missed the object"}
      attached_object: {type: string, description: "object now attached to the gripper, if any"}
      max_effort: {type: float, description: "gripper effort used, read from the gripper_max_effort parameter"}
    errors:
      OBJECT_NOT_FOUND: thorp_world knows no object by that id
      OBJECT_NOT_ON_TABLE: the object is in the gripper or on the tray, or missing from where it was last seen
      OBJECT_ATTACHED: the gripper holds another object; place it, or put it on the tray, first
      NOT_AT_TABLE: the object is on a table the robot isn't at; reach_table that table first
      OUT_OF_REACH: the object is on the robot's table, but beyond the arm's reach from where the robot is; reach_table another side of the table
    test:
      inputs: {object_name: "clover 1"}
      setup:
        - {subtree: reach_table, inputs: {table_id: "table 1"}, unless: {at_table: "table 1"}}
        - {subtree: detect_objects}
      # The scene on this bench is fixed, so "did the pickup work" has a right answer.
      expect: succeeded
      timeout: 120

  place_object:
    description: >
      Place the object currently held by the gripper at a given pose on the table the robot is
      at, and record it there in thorp_world.
    status: ok
    stack: [manipulation]
    inputs:
      object_name: {type: string, description: "id of the object in the gripper, as pickup_object reports it in attached_object"}
      place_pose: {type: geometry_msgs::msg::PoseStamped, description: "where the object's center goes, as 'x;y;yaw;frame' or 'x;y;z;roll;pitch;yaw;frame'; z is the surface height plus half the object's height, plus a few millimeters, and the short form leaves z at 0, which is the floor"}
    outputs:
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why it failed: one of errors, or else the place action's"}
    errors:
      NOT_AT_TABLE: the robot isn't at a table; reach_table one first
    test:
      # A clear spot on the near edge of the table; z is the clover's center once there, on the
      # 0.47 m high table, 8 mm above. In the map frame, so it stays put while the setup chain
      # drives the robot to the table.
      inputs: {object_name: "clover 1", place_pose: "0.2;0.0;0.502;0.0;0.0;0.0;map"}
      setup:
        - {subtree: reach_table, inputs: {table_id: "table 1"}, unless: {at_table: "table 1"}}
        - {subtree: detect_objects}
        - {subtree: pickup_object, inputs: {object_name: "clover 1"}}
      expect: any
      timeout: 120

  place_on_tray:
    description: >
      Place the held object on the robot's own tray, on the next free slot, found from the
      objects already on the tray in the planning scene, or on the following free slots if
      placing there fails; there, the placed object then lies level on the tray, where it fell.
      thorp_world records it on that slot.
    status: ok
    stack: [manipulation]
    inputs:
      object_name: {type: string, description: "id of the object in the gripper, to stow on the tray"}
    outputs:
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why it failed, from the place action"}
      pose_on_tray: {type: geometry_msgs::msg::PoseStamped, description: "slot the object was placed in"}
    test:
      inputs: {object_name: "clover 1"}
      setup:
        - {subtree: reach_table, inputs: {table_id: "table 1"}, unless: {at_table: "table 1"}}
        - {subtree: detect_objects}
        - {subtree: pickup_object, inputs: {object_name: "clover 1"}}
      expect: any
      timeout: 120

  clear_gripper:
    description: >
      Open the gripper, and if the planning scene has an object attached to it, detach it and
      remove it from the scene. For a gripper holding something it shouldn't, or a planning
      scene that believes so after a failed pickup; pickup_object does it itself first.
      thorp_world takes an object it believed in the gripper as missing.
    status: ok
    stack: [manipulation]
    inputs: {}
    outputs:
      attached_object: {type: string, when: maybe, description: "the object that was attached, if any"}
    test:
      inputs: {}
      expect: succeeded
      timeout: 60

  stow_arm:
    description: >
      Fold the arm into its stowed pose, out of the camera's view, while half-closing the
      gripper unless it holds an object. For driving around, or to clear the camera's view
      before detecting objects.
    status: ok
    stack: [manipulation]
    inputs: {}
    outputs:
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why moving the arm to stow failed, from move_group"}
    test:
      inputs: {}
      expect: succeeded
      timeout: 60

  finish_manipulation:
    description: >
      Stow the arm as stow_arm does, then remove from the planning scene every object but
      those on the tray, table included. For wrapping up after manipulating at a table. An
      object still in the gripper stays attached; clear_gripper first to drop it.
    status: ok
    stack: [manipulation]
    inputs: {}
    outputs:
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why moving the arm to stow failed, from move_group"}
    test:
      inputs: {}
      expect: succeeded
      timeout: 60

  # ---------------------------------------------------------------------- perception -------

  detect_objects:
    description: >
      Segment the surface in front of the robot and classify the objects on it, adding every
      one to the MoveIt planning scene and returning a name and a color for each. Those
      names are what pickup_object, place_object and place_on_tray take as object_name, so
      this is the step that tells you what there is to manipulate. It doesn't move the robot:
      it looks at whatever is in front of the camera now, so drive to the table first.
    status: ok
    stack: [perception]
    inputs: {}
    outputs:
      objects: {type: std::vector<moveit_msgs::msg::CollisionObject>, description: "the objects found on the surface, each as name and color; empty when there are none"}
      surface: {type: moveit_msgs::msg::CollisionObject, description: "the support surface they were found on, as name and color"}
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why it failed: one of errors"}
    errors:
      VIEW_BLOCKED: something close to the camera, as the arm when not stowed, blocks its view; stow_arm, then look again
    test:
      inputs: {}
      expect: any          # needs a table in view; whether there is one is the scene's business
      timeout: 60

  detect_table:
    description: >
      Find the table in front of the robot, record it in thorp_world, and report it by the id
      the world knows it by, as "table 1", with its size and where it is on the map. A table
      detected again keeps its id. Only one surface is reported, however many are in view. This
      is the step that tells you a table is there and where to stand relative to it; it does
      not move the robot, and it fails when nothing in view is a large enough surface. It only
      sees a table close in front; for one known but farther away, go_to_table first.
    status: ok
    stack: [perception]
    inputs: {}
    outputs:
      table_id: {type: string, description: "the table's id in thorp_world"}
      table: {type: moveit_msgs::msg::CollisionObject, description: "the table: id, width, depth, height, color and center pose"}
      table_pose: {type: geometry_msgs::msg::PoseStamped, description: "where that table is, in the map frame"}
    test:
      inputs: {}
      expect: any          # needs a surface in view; whether there is one is the scene's business
      timeout: 60

  # ------------------------------------------------------------------------- tables --------

  inspect_table:
    description: >
      Look a table over from a viewing pose on its side nearest to the robot, and report it and
      the objects on it, recording them in thorp_world, and the table as inspected: the table the
      world knows as table_id, or the one in front if none is given. Fails when no table is in
      view or it isn't a usable size. The objects keep their ids from here on, but the viewing
      pose is outside arm reach: reach_table before picking one.
    status: ok
    stack: [navigation, perception]
    inputs:
      table_id: {type: string, optional: true, description: "id of the table to inspect; leave it out to take the one in front"}
    outputs:
      table_id: {type: string, description: "the table's id in thorp_world"}
      table: {type: moveit_msgs::msg::CollisionObject, description: "the table, as seen from the viewing pose"}
      table_pose: {type: geometry_msgs::msg::PoseStamped, description: "where that table is, in the map frame"}
      inspect_pose: {type: geometry_msgs::msg::PoseStamped, description: "the viewing pose it looked from"}
      objects: {type: std::vector<moveit_msgs::msg::CollisionObject>, description: "the objects on the table, each as id and color; empty when there are none"}
      surface: {type: moveit_msgs::msg::CollisionObject, description: "the surface they were found on, as id and color"}
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why it failed: one of errors, or else from reading the robot pose"}
    errors:
      TABLE_NOT_FOUND: thorp_world knows no table by that id
      VIEW_BLOCKED: something close to the camera, as the arm when not stowed, blocks its view of the table; stow_arm, then detect_objects
    test:
      inputs: {table_id: "table 1"}
      expect: any
      timeout: 300

  go_to_table:
    description: >
      Drive to the viewing pose of a table thorp_world knows: facing its side nearest the robot,
      just outside arm reach. detect_table, detect_objects and cleanup_table only find a table
      close in front of the robot; when it isn't, come here first.
    status: ok
    stack: [navigation]
    inputs:
      table_id: {type: string, description: "id of the table to go to"}
    outputs:
      inspect_pose: {type: geometry_msgs::msg::PoseStamped, description: "the viewing pose it drove to"}
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why it failed: one of errors, or else from reading the robot pose"}
      nav_error: {type: uint16_t, when: failure, description: "error code from Nav2's navigate_to_pose"}
    errors:
      TABLE_NOT_FOUND: thorp_world knows no table by that id
    test:
      inputs: {table_id: "table 1"}
      expect: any
      timeout: 300

  reach_table:
    description: >
      Park against a table, ready to pick from or place on it, on its north, south, east or
      west side: the one asked for, or else the side closest to the robot. Docked, the arm
      reaches only the part of the table near that side, so to work on another part, dock at
      the side nearest to it. It backs out first if docked, stows the arm, drives to that
      side's viewing pose, detects the table again from there and docks under its eaves. It
      doesn't look at the objects on the table: detect_objects after it, to see what is there
      and within reach. The table is the one thorp_world knows as table_id, or the one in front
      if none is given.
    status: ok
    stack: [navigation, manipulation, perception]
    inputs:
      table_id: {type: string, optional: true, description: "id of the table to park against; leave it out to take the one in front"}
      side: {type: string, optional: true, description: "north, south, east or west, the table's side toward the map's +y, -y, +x or -x; the side closest to the robot if left out"}
    outputs:
      table_id: {type: string, description: "the id of the table it parked against"}
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why it failed: one of errors, or else from reading the robot pose or stowing the arm"}
      nav_error: {type: uint16_t, when: failure, description: "error code from Nav2's navigate_to_pose or follow_path, docking"}
    errors:
      TABLE_NOT_FOUND: thorp_world knows no table by that id
      INVALID_TARGET_POSE: that side of the table has no pose to dock at free of obstacles; try another side
    test:
      inputs: {table_id: "table 1"}
      expect: any          # docking, which the scene can defeat
      timeout: 180

  leave_table:
    description: >
      Back straight out from the table the robot is at, far enough to navigate around it again,
      restore the table's costmap footprint, and record that the robot left it. Takes no
      arguments: it backs out along the way the robot is facing.
    status: ok
    stack: [navigation]
    inputs: {}
    outputs:
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why it failed: one of errors"}
      nav_error: {type: uint16_t, when: failure, description: "error code from Nav2's backup behavior"}
    errors:
      NOT_AT_TABLE: the robot isn't at a table, so there is none to leave
    test:
      inputs: {}
      setup:
        - {subtree: reach_table, inputs: {table_id: "table 1"}, unless: {at_table: "table 1"}}
      expect: any
      timeout: 180

  validate_table:
    description: >
      Look a detected table over from a viewpoint and decide whether it is a usable size,
      recording it in thorp_world as inspected, usable or not.
    status: ok
    stack: [navigation, perception]
    inputs: {}
    outputs:
      table_id: {type: string, description: "the table's id in thorp_world"}
      table: {type: moveit_msgs::msg::CollisionObject, description: "the validated table"}
      table_pose: {type: geometry_msgs::msg::PoseStamped, description: "pose of the table"}
      inspect_pose: {type: geometry_msgs::msg::PoseStamped, description: "viewpoint used to inspect it"}
    test:
      inputs: {}
      expect: any
      timeout: 300

  cleanup_table:
    description: >
      Clear every reachable object from one table onto the tray, working through a planned
      sequence of pickup locations around it: the table thorp_world knows as table_id, or the
      one in front if none is given, as validate_table does. Either way it looks for the objects
      from where the robot stands, so start it close in front of the table: go_to_table gets
      there.
    status: ok
    stack: [navigation, manipulation, perception]
    inputs:
      table_id: {type: string, optional: true, description: "id of the table to clear; leave it out to take the one in front"}
      given_up_count: {type: unsigned int, description: "objects abandoned so far; 0 to start"}
    outputs:
      pickup_pose: {type: geometry_msgs::msg::PoseStamped, when: maybe, description: "pose the last pickup was attempted from"}
      error: {type: thorp_msgs::msg::ThorpError, when: maybe, description: "why the last action failed"}
      nav_error: {type: uint16_t, when: maybe, description: "error code from the last Nav2 action"}
    errors:
      TABLE_NOT_FOUND: thorp_world knows no table by that id
    test:
      inputs: {table_id: "table 1", given_up_count: 0}
      expect: any
      timeout: 900

  # ---------------------------------------------------------------------- navigation -------

  goto_pose:
    description: >
      Drive to one pose on the map, planning and controlling the whole way, and stop there
      facing the yaw that was asked for. It tries once: if the pose turns out to be
      unreachable the tree fails and error says why, so the caller can choose somewhere else
      rather than leave the robot grinding away at it. Use reach_first_pose instead when you
      have several candidate poses and only care that one of them works.
    status: ok
    stack: [navigation]
    inputs:
      pose: {type: geometry_msgs::msg::PoseStamped, description: "where to drive to, as 'x;y;yaw;frame'"}
    outputs:
      nav_error: {type: uint16_t, when: failure, description: "error code from Nav2's navigate_to_pose; only set when the drive failed"}
    test:
      inputs: {pose: '-1.0;-1.0;0.0;map'}
      expect: any
      timeout: 300

  look_at_pose:
    description: >
      Turn on the spot until the robot is facing a given pose, without going anywhere. The
      camera has about a 57 degree field of view and is fixed to the base, so anything to the
      side or behind has to be turned toward before a perception capability can see it. Prefer
      it over goto_pose when only the heading is wrong. It ends two seconds after turning, once
      the detections have caught up with the camera.
    status: ok
    stack: [navigation]
    inputs:
      pose: {type: geometry_msgs::msg::PoseStamped, description: "what to face; only its position matters"}
    outputs:
      robot_pose: {type: geometry_msgs::msg::PoseStamped, description: "where the robot was before turning"}
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why it failed, from reading the robot pose or from Nav2's spin behavior"}
    test:
      inputs: {pose: "-0.5;1.5;0.0;map"}    # the cat llm_playground spawns
      expect: succeeded
      timeout: 60

  # ------------------------------------------------- app-level trees, no caller inputs -----

  patrol_2_points:
    description: >
      Drive back and forth between two hardcoded poses of the playground map, ten times. Mostly a
      navigation smoke test.
    kind: app
    status: ok
    stack: [navigation]
    inputs: {}
    outputs:
      nav_error: {type: uint16_t, when: failure, description: "error code from Nav2's navigate_to_pose, for the last goal"}
    test:
      inputs: {}
      expect: any
      timeout: 600

  explore_house:
    description: >
      Cover the whole map with the given strategy, cover_in_one_tour (a single tour of camera
      poses over the whole map) or cover_room_by_room (a tour for each room, one room after
      another), or else with the one the exploration_method parameter selects.
    status: ok
    stack: [navigation, exploration]
    inputs:
      exploration_method: {type: string, optional: true, description: "cover_in_one_tour or cover_room_by_room; leave it out to use the configured one"}
    outputs:
      exploration_method: {type: string, description: "strategy actually used"}
    test:
      inputs: {}
      expect: any
      timeout: 900

  cat_hunter:
    description: >
      Explore the house looking for cats, and hunt each one seen: approach it, and fire the
      cannon at it while following it. Ends when the ammo or the exploration does.
    kind: app
    status: ok
    stack: [navigation, exploration, target_detection]
    inputs: {}
    outputs:
      target_pose: {type: geometry_msgs::msg::PoseStamped, when: maybe, description: "where the last target was spotted"}
    test:
      inputs: {}
      expect: runs
      cancel_after: 60
      timeout: 900

  object_gatherer:
    description: >
      Explore the house, and for every table found that thorp_world doesn't know as inspected,
      validate it and clear the objects from it onto the tray.
    kind: app
    status: ok
    stack: [navigation, manipulation, perception, exploration]
    inputs: {}
    outputs:
      table: {type: moveit_msgs::msg::CollisionObject, description: "table being worked on (not serializable yet)"}
      table_pose: {type: geometry_msgs::msg::PoseStamped, description: "pose of that table"}
    test:
      inputs: {}
      expect: any
      timeout: 1800

  object_manip:
    description: >
      Interactive tabletop loop: waits for a user command, then detects objects and drags,
      picks and places whichever one was chosen; dropped over the tray, it goes on its next
      free slot.
    kind: app
    status: ok
    stack: [manipulation, perception]
    inputs: {}
    outputs:
      object_name: {type: string, when: maybe, description: "object last operated on"}
      user_command: {type: string, description: "command last read from the user"}
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why the last manipulation action failed"}
    test:
      inputs: {}
      expect: runs
      cancel_after: 30
      timeout: 300   # runs until commanded to exit; expected to be canceled

  approach_target:
    description: >
      The approach half of cat_hunter: follow the target the tracker sees until it is within
      1.5 m and 1.5 rad of the robot's heading. Fails if the target gets lost, or isn't that
      close after 25 seconds.
    status: ok
    stack: [navigation, target_detection]
    inputs: {}
    outputs:
      target_pose: {type: geometry_msgs::msg::PoseStamped, when: maybe, description: "where the target was last seen"}
      robot_pose: {type: geometry_msgs::msg::PoseStamped, when: maybe, description: "robot pose at the last check"}
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why reading the robot pose failed"}
      follow_error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why following failed, from opennav_following"}
    test:
      inputs: {}
      setup:
        - subtree: look_at_pose    # the cat is to the left, and the camera is fixed
          inputs: {pose: "-0.5;1.5;0.0;map"}
      expect: any
      timeout: 120

  hunt_cat:
    description: >
      The attack half of cat_hunter: follow the target the tracker sees, aiming and firing the
      cannon whenever it is within 1.0 m and 0.2 rad of the robot's heading. Ends when the
      target is not seen for half a second, as when toppled, or there's no ammo left, with the
      cannon leveled.
    status: ok
    stack: [navigation, target_detection]
    inputs: {}
    outputs:
      cannon_tilt_angle: {type: float, when: maybe, description: "angle the cannon was tilted to"}
      target_pose: {type: geometry_msgs::msg::PoseStamped, when: maybe, description: "where the target was last seen"}
      robot_pose: {type: geometry_msgs::msg::PoseStamped, when: maybe, description: "robot pose at the last check"}
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why reading the robot pose failed"}
      follow_error: {type: thorp_msgs::msg::ThorpError, when: maybe, description: "why following failed, from opennav_following, if it lost the target"}
    test:
      inputs: {}
      setup:
        - subtree: look_at_pose    # the cat is to the left, and the camera is fixed
          inputs: {pose: "-0.5;1.5;0.0;map"}
      # 'any' because the following sits under a ForceSuccess: the tree succeeds having seen
      # nothing, and only cannon_tilt_angle tells the two apart
      expect: any
      expect_outputs: [cannon_tilt_angle]
      timeout: 300

  cover_in_one_tour:
    description: >
      Cover the whole map in one tour: plan the poses from where the camera sees all of it, from
      where the robot stands, and drive through them. Resumes the poses left, if any.
    status: ok
    stack: [navigation, exploration]
    inputs: {}
    outputs:
      coverage_waypoints: {type: std::vector<geometry_msgs::msg::PoseStamped>, description: "the poses left to drive through; empty once done"}
      robot_pose: {type: geometry_msgs::msg::PoseStamped, when: maybe, description: "robot pose when planning started"}
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why reading the robot pose failed"}
    test:
      inputs: {}
      expect: any
      timeout: 900

  cover_room_by_room:
    description: >
      Cover the whole map room by room: segment it into rooms and order them from where the robot
      stands; then, for each room, plan the poses from where the camera sees all of it and drive
      through them. Resumes the rooms and poses left, if any.
    status: ok
    stack: [navigation, exploration]
    inputs: {}
    outputs:
      rooms: {type: std::vector<unsigned int>, when: maybe, description: "ids of the rooms segmented"}
      room_sequence: {type: std::vector<unsigned int>, description: "rooms left to visit, in order; empty once done"}
      room_number: {type: unsigned int, description: "room currently being covered"}
      coverage_waypoints: {type: std::vector<geometry_msgs::msg::PoseStamped>, description: "waypoints for the current room"}
      robot_pose: {type: geometry_msgs::msg::PoseStamped, when: maybe, description: "robot pose when planning started"}
    test:
      inputs: {}
      expect: any
      timeout: 1800

  # ------------------- structured inputs: lists, maps and tables, seeded as json ----------
  #
  # These were blocked until bt_server learned to build structured values. A json array of
  # pose strings becomes a std::vector<geometry_msgs::msg::PoseStamped>, a json object of counts a
  # std::map<std::string, uint32_t>, and a json object with name/pose/width/depth/height a
  # moveit_msgs::msg::CollisionObject -- the fields the trees actually read, with the
  # point cloud, image and grasps left default, since an agent has none of those.

  reach_first_pose:
    description: >
      Drive to the first pose of a list, dropping poses that turn out to be unreachable until
      one works.
    status: ok
    stack: [navigation]
    inputs:
      poses: {type: std::vector<geometry_msgs::msg::PoseStamped>, description: "candidate poses, tried in order, each as 'x;y;yaw;frame'"}
    outputs:
      next_pose: {type: geometry_msgs::msg::PoseStamped, description: "the pose actually reached"}
      goto_pose_error: {type: uint16_t, when: failure, description: "error code from Nav2's navigate_to_pose"}
    test:
      # the first pose is off the playground map, so it has to be dropped
      inputs: {poses: ['2.0;5.0;1.57;map', '-1.0;-1.0;0.0;map']}
      expect: any
      timeout: 300

  follow_waypoints:
    description: >
      Go through a list of waypoints in order, as Nav2's navigate_through_poses plans them,
      resuming from the next waypoint not passed yet whenever it fails. Only the last
      waypoint's heading is reached; the others are just driven through.
    status: ok
    stack: [navigation]
    inputs:
      waypoints: {type: std::vector<geometry_msgs::msg::PoseStamped>, description: "waypoints to follow in order, each as 'x;y;yaw;frame', as cover_in_one_tour and cover_room_by_room return them in coverage_waypoints"}
    outputs:
      next_waypoint: {type: unsigned long, when: maybe, description: "index of the waypoint being driven to"}
      robot_pose: {type: geometry_msgs::msg::PoseStamped, when: maybe, description: "robot pose while following"}
      nav_error: {type: uint16_t, when: failure, description: "error code from Nav2's navigate_through_poses"}
    test:
      inputs: {waypoints: ['-1.0;-1.0;0.0;map', '-1.5;0.0;1.57;map']}
      expect: any
      timeout: 600

  pickup_objects:
    description: >
      Pick up the objects of a planned sequence one at a time, stowing each on the tray and
      recording the ones that keep failing. An object it can't put on the tray is dropped, and
      lost for thorp_world.
    status: ok
    stack: [manipulation, perception]
    inputs:
      failures: {type: "std::map<std::string, uint32_t>", description: "per-object failure counts so far; {} to start"}
      given_up_count: {type: unsigned int, description: "objects abandoned so far; 0 to start"}
    outputs:
      object_name: {type: string, when: maybe, description: "object last picked"}
      dropped_object: {type: string, when: maybe, description: "object last dropped, as it couldn't be put on the tray"}
      error: {type: thorp_msgs::msg::ThorpError, when: failure, description: "why the last action failed"}
    test:
      inputs: {failures: {}, given_up_count: 0}
      setup:
        - {subtree: reach_table, inputs: {table_id: "table 1"}, unless: {at_table: "table 1"}}
        - {subtree: detect_objects}
      expect: any
      timeout: 600

# Trees under bt/ that are deliberately NOT capabilities, and why. Listing them is what lets
# test_capabilities_match_trees.py insist every tree is accounted for: add one and you have to
# either describe it above or say here why an agent shouldn't see it. Silence would otherwise
# mean a capability nobody ever told the agent about.
not_capabilities:
  dock_at_table: >
    Internal: drives straight in to a pose by a table and records the robot docked there, as
    reach_table and cleanup_table do once they have chosen the pose. Not offered, as choosing
    a docking pose takes the table's geometry; reach_table is the capability.
  test_reset_scene: >
    Test fixture: empties the gripper, stows the arm and clears the planning scene, for
    test_capabilities.py to start every test from the same robot state.
  test_server: >
    Test fixture: transforms a pose and reads back four parameters, exercising bt_server's
    json/blackboard plumbing end to end. Not a robot capability, and not runnable from the
    capability suite either -- the parameters it reads are seeded by test_bt_server.py, which
    is where it is tested.
  test_server_slow: >
    Test fixture: sleeps long enough that a goal can be canceled mid-run, for checking
    preemption returns the outputs produced so far.
  test_server_needs_list: >
    Test fixture: pops from a list, so a goal that omits it must abort naming the list rather
    than crash the server, and one that supplies it checks a json array seeds a pose list.
  test_server_local_offset: >
    Test fixture: a TransformPose offset along the pose's own axes, which is how
    leave_table backs out.
  test_server_table: >
    Test fixture: TableValidSize reads only a table's width and depth, so whether it passes
    says whether those fields survived being seeded from json.
  test_world_table: >
    Test fixture: GetTable, against test/world.yaml; see test_world_nodes.py.
  test_world_current: >
    Test fixture: GetCurrentTable, against test/world.yaml.
  test_world_pickable: >
    Test fixture: ObjectPickable, against test/world.yaml.
  test_world_update: >
    Test fixture: UpdateWorld, against test/world.yaml.
  test_world_visited: >
    Test fixture: TableVisited, against test/world.yaml.
  test_server_counts: >
    Test fixture: bumps a count in a map and writes it back, to check a map round-trips.
  aim_at_cats: >
    Debugging app: the cat hunter without exploring nor firing, to watch it follow cats and aim
    the cannon at them. Endless, and of no use to the agent, that hunts with hunt_cat.
  aim_at_cat: >
    The half of aim_at_cats that follows a cat and aims at it: hunt_cat without firing, which
    the agent has no reason to want.
