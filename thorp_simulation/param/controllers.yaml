# ros2_control configuration for Thorp simulation: arm, gripper and cannon servos

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    cannon_joint_controller:
      type: position_controllers/JointGroupPositionController

# Publish servo joint states; wheel joint states come from Gazebo
joint_state_broadcaster:
  ros__parameters:
    update_rate: 50  # Hz
    joints: [arm_shoulder_pan_joint, arm_shoulder_lift_joint, arm_elbow_flex_joint, arm_wrist_flex_joint,
             gripper_joint, cannon_joint]
    interfaces: [position, velocity, effort]

# Arm position controller
arm_controller:
  ros__parameters:
    joints: [arm_shoulder_pan_joint, arm_shoulder_lift_joint, arm_elbow_flex_joint, arm_wrist_flex_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    # start from the measured joint positions, not from the command interfaces, that start at 0 instead of the
    # initial resting pose
    set_last_command_interface_value_as_state_on_activation: false
    # Cartesian paths planned by MoveIt Task Constructor can end with tiny velocities, as -5e-4 rad/s
    allow_nonzero_velocity_at_trajectory_end: true
    action_monitor_rate: 10.0
    constraints:
      goal_time: 10.0
      stopped_velocity_tolerance: 0.3  # I need a very large number because the shoulder lift joint still has a
                                       # velocity even if stopped, aborting the execution as it never reaches the goal
      # no path tolerance (0.0): Gazebo emulates position control with velocity commands, and under load the
      # shoulder lift occasionally lags more than Noetic's 0.1 rad; goals must still be reached within 0.1 rad
      arm_shoulder_pan_joint: {trajectory: 0.0, goal: 0.1}
      arm_shoulder_lift_joint: {trajectory: 0.0, goal: 0.1}
      arm_elbow_flex_joint: {trajectory: 0.0, goal: 0.1}
      arm_wrist_flex_joint: {trajectory: 0.0, goal: 0.1}

# Gripper command action, on gripper_controller/gripper_cmd; goals are gripper_joint angles. Simulated servos report
# no effort, so the gripper can only stop by reaching the goal or stalling (e.g. when grasping something)
gripper_controller:
  ros__parameters:
    joint: gripper_joint
    goal_tolerance: 0.01
    allow_stalling: true
    # Pressing an object, the simulated servo chatters: its velocity jumps to the limit every 0.2 s or more, and
    # jitters up to 0.005 rad/s in between, so a longer or stricter stall detection can take seconds
    stall_velocity_threshold: 0.01
    stall_timeout: 0.1

# Cannon position controller; controllers can't be named as their joints
cannon_joint_controller:
  ros__parameters:
    joints: [cannon_joint]
