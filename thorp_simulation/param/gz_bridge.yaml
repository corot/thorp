# ros_gz_bridge configuration for Thorp simulation on Gazebo Harmonic
# Gazebo topic names are set on thorp_description/urdf/thorp_gazebo.urdf.xacro

# Clock, base, joint states and cannon trigger
# Gazebo publishes the clock on every step; thorp_gazebo.launch.py throttles it into /clock
- ros_topic_name: /clock_raw
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /mobile_base/commands/velocity
  gz_topic_name: /mobile_base/commands/velocity
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /odom
  gz_topic_name: /odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /tf
  gz_topic_name: /tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: /joint_states
  gz_topic_name: /joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /ground_truth/odom
  gz_topic_name: /ground_truth/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /mobile_base/sensors/imu_data
  gz_topic_name: /mobile_base/sensors/imu_data
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: /arbotix/cannon_trigger
  gz_topic_name: /arbotix/cannon_trigger
  ros_type_name: std_msgs/msg/Bool
  gz_type_name: gz.msgs.Boolean
  direction: ROS_TO_GZ

# Kinect RGBD camera; Gazebo point clouds use the camera link axes, so thorp_gazebo.launch.py
# creates them from the depth images instead, on the RGB optical frame as the real cameras
- ros_topic_name: /kinect/rgb/image_raw
  gz_topic_name: /kinect/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /kinect/rgb/camera_info
  gz_topic_name: /kinect/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /kinect/depth_registered/image_raw
  gz_topic_name: /kinect/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /kinect/depth_registered/camera_info
  gz_topic_name: /kinect/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

