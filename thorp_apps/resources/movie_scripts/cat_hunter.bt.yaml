# Movie script for BT cat hunter app on small house
# We update camera location when starting the following states
#  - frame: camera reference frame
#  - focus can be one of
#    - 3D point (provided as a list of three floats)
#    - SMACH userdata key containing a stamped pose
#    - ROS topic providing a stamped pose
#  - eye must be a 3D point relative to focus location

PlanFullCoverage:
  frame: map
  focus: [0, 0, 0]
  eye: [0, -0.1, 14]
follow_waypoints:
  frame: base_footprint
  focus: [1.0, 0, 0]
  eye: [-2.0, 0, 4]
AimCannon:
  frame: kinect_rgb_frame
  focus: [1, 0, 0]
  eye: [-0.98, 0, 0]
