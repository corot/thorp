# Configuration for the velocity commands multiplexer (twist_mux) inputs, keeping the Noetic topics.
#
# Individual input configuration:
#   topic:          The topic that provides cmd_vel messages
#   timeout:        Time in seconds without incoming messages to consider this topic inactive
#   priority:       Priority: an UNIQUE unsigned integer from 0 (lowest) to 255

/**:
  ros__parameters:
    use_stamped: false  # Twist, as Nav2 and the Kobuki base use
    topics:
      safety_controller:  # Safe reactive controller
        topic:    /cmd_vel_mux/input/safety_controller
        timeout:  0.2
        priority: 10
      teleoperation:
        topic:    /cmd_vel_mux/input/teleoperation
        timeout:  1.0
        priority: 8
      special_task:  # Thorp tasks control
        topic:    /cmd_vel_mux/input/special_task
        timeout:  1.0
        priority: 6
      auto_docking:  # Auto-dock control
        topic:    /cmd_vel_mux/input/auto_docking
        timeout:  1.0
        priority: 5
      servoing:  # Visual servoing
        topic:    /cmd_vel_mux/input/servoing
        timeout:  1.0
        priority: 4
      following:  # Pose following
        topic:    /cmd_vel_mux/input/following
        timeout:  1.0
        priority: 3
      navigation:
        topic:    /cmd_vel_mux/input/navigation
        timeout:  1.0
        priority: 2
