# Configuration for the velocity commands multiplexer (twist_mux) inputs: each source's commands on <source>/cmd_vel,
# or <source>/cmd_vel_smoothed for those going through a velocity smoother.
#
# Individual input configuration:
#   topic:          The topic that provides cmd_vel messages
#   timeout:        Time in seconds without incoming messages to consider this topic inactive
#   priority:       Priority: an UNIQUE unsigned integer from 0 (lowest) to 255

/**:
  ros__parameters:
    use_stamped: false  # Twist, as Nav2 and the Kobuki base use
    topics:
      safety_controller:  # Safe reactive controller
        topic:    /safety_controller/cmd_vel
        timeout:  0.2
        priority: 10
      teleoperation:
        topic:    /teleoperation/cmd_vel
        timeout:  1.0
        priority: 8
      special_task:  # Thorp tasks control
        topic:    /special_task/cmd_vel
        timeout:  1.0
        priority: 6
      auto_docking:  # Auto-dock control
        topic:    /auto_docking/cmd_vel
        timeout:  1.0
        priority: 5
      following:  # Pose following
        topic:    /following/cmd_vel_smoothed
        timeout:  1.0
        priority: 3
      navigation:
        topic:    /navigation/cmd_vel_smoothed
        timeout:  1.0
        priority: 2
