# Dev workflow:
# On the host:
#   cd ~/catkin_ws/src/thorp/thorp_bringup/docker && docker compose -f docker-compose.dev.yml up -d
#   cd ~/catkin_ws/src/thorp/thorp_bringup/docker && docker compose -f docker-compose.dev.yml exec thorp-dev bash
#   cd ~/catkin_ws/src/thorp/thorp_bringup/docker && docker compose -f docker-compose.dev.yml down
# Inside the container (note /catkin_ws there, not ~/catkin_ws):
#   cd /catkin_ws && catkin build thorp_msgs thorp_bt_cpp
#   cd /catkin_ws && catkin build thorp_apps          # the full stack, once you want it
#
# Prefer `up -d` + `exec` over `run --rm`: `exec` opens as many shells into the *same*
# container as you need (roscore in one, a node in another, a test script in a third), and
# nothing is thrown away between them. Each `run` instead creates a fresh container, and
# with --rm anything written outside the named volumes below dies with it.
#
# `run`/`up` rebuilds the image when it's missing, since this service declares `build:`;
# pass --no-build to use whatever image is already there.
#
# No --cmake-args needed when building: the image runs `catkin config` at image build time
# with the same flags the deployment Dockerfile passes (Release, C++17), and those live in
# the workspace profile.
#
# Edit files on your host as usual; the container always sees the live checkout. build/
# and devel/ live in a named volume so they persist across `run`s without touching your
# checkout or requiring a rebuild of the image.
services:
  thorp-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: thorp:noetic-dev
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    environment:
      - OPENROUTER_API_KEY
      - DISABLE_ROS1_EOL_WARNINGS=1
      # gazebo and rviz need an X display and the cookie to open it. DISPLAY comes from your
      # shell, falling back to the :1 the deployment container assumes.
      - DISPLAY=${DISPLAY:-:1}
      - XAUTHORITY=/tmp/.Xauthority
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # GPU passthrough, the equivalent of `docker run --gpus all`. Needs nvidia-container-toolkit
    # on the host; on a machine without it, `up` fails with "could not select device driver" --
    # comment this block out there, or run the GUI nodes on the host instead.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../..:/catkin_ws/src/thorp            # your local `thorp` checkout (repo root, two levels up from here)
      - thorp-dev-build:/catkin_ws/build
      - thorp-dev-devel:/catkin_ws/devel
      - thorp-dev-logs:/catkin_ws/logs
      - thorp-dev-claude:/root/.claude        # Claude Code's login and session history
      - /tmp/.X11-unix:/tmp/.X11-unix:rw     # the X socket
      # The X cookie. That default is where gdm puts it for uid 1000; if yours lives elsewhere
      # (`echo $XAUTHORITY`, or ~/.Xauthority on a non-gdm session), set XAUTHORITY_HOST
      # instead of editing this file.
      - ${XAUTHORITY_HOST:-/run/user/1000/gdm/Xauthority}:/tmp/.Xauthority:ro

volumes:
  thorp-dev-build:
  thorp-dev-devel:
  thorp-dev-logs:
  thorp-dev-claude:
